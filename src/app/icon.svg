<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!--
    Algoryq One app icon.

    Same glyph geometry as algoryq.com/icon.svg — the mark is the parent's and
    is never redrawn (CLAUDE.md rule 12). The product identity is carried by the
    tile and the crossbar instead:

      parent   ink tile   · white glyph · blue  bar
      this     blue tile  · white glyph · cyan  bar

    Both the tile and the accent differ, so the two are not confusable in a tab
    strip at 16px — which is the only size that really matters for a favicon.
    The cyan is --color-accent, the same hue the site already uses in the header
    accent bar and the aurora wash, so this reads as our palette rather than an
    arbitrary second colour.

    Colours are literal hex: an SVG served as a static asset gets no CSS custom
    properties. They mirror the ramp in globals.css — brand-800 #043075,
    brand-600 #044CB6, accent #00BEC7.
  -->
  <defs>
    <linearGradient id="one-tile" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#043075"/>
      <stop offset="1" stop-color="#044CB6"/>
    </linearGradient>
    <linearGradient id="one-bar" x1="41.5" y1="75" x2="95" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00BEC7"/>
      <stop offset="1" stop-color="#9FF0F4"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#one-tile)"/>
  <g transform="translate(10 10) scale(0.8)" stroke-linejoin="round" paint-order="stroke" stroke-width="4">
    <path fill="#FFFFFF" stroke="#FFFFFF" d="M50 8 L76.4 63.5 L59.75 63.5 L50 44 L26 92 L10 92 Z"/>
    <path fill="url(#one-bar)" stroke="url(#one-bar)" d="M42.55 69 L87.05 69 L93.65 81 L46.15 81 Z"/>
    <path fill="#FFFFFF" stroke="#FFFFFF" d="M72 86.5 L86 86.5 L90 92 L76 92 Z"/>
  </g>
</svg>
